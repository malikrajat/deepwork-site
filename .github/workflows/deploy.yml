name: Deploy site to GitHub Pages

# This repository contains the website only. The DeepWork application lives in
# its own repository and has its own workflow; nothing here touches it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # `build:github` sets `--base-href=/deepwork-site/`, which is what makes
      # the hashed JS, the CSS, the fonts and the screenshots resolve under
      # `<owner>.github.io/deepwork-site/` instead of the domain root.
      #
      # If the repository is ever renamed, this base href and the one in
      # `package.json` are the only two places that have to change.
      - name: Build the site
        run: npm run build:github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/deepwork-site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
