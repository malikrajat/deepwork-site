name: CI

# Everything a change has to survive before it is worth deploying: it must be
# formatted, pass the linter, compile, and still render correctly in a browser
# at ten viewport widths. Runs on every pull request, on every push to main, and
# on demand.
#
# Dependency vulnerability scanning is deliberately NOT part of this pipeline.
# `npm audit` is one command away and `.npmrc` documents the trade-off; see the
# README section "What this pipeline does not do".

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Biome formats and lints the TypeScript, the JSON and the tooling
      # scripts; Prettier formats the Angular templates and the stylesheet,
      # because Biome's HTML parser does not understand `@if` / `@for`. One
      # command runs both so a contributor never has to remember which is which.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # The root-base build, which is the one Netlify publishes — this is the
      # artefact that actually ships, not an approximation of it.
      #
      # A base href other than `/` must not be introduced here. `--base-href=/x/`
      # rewrites every asset URL to `/x/main-<hash>.js`, while the audit serves
      # `dist/` at the server root, so it would look for
      # `dist/deepwork-site/browser/x/main-<hash>.js` — a path that does not exist.
      # Every script 404s, Angular never bootstraps, and the audit then fails on
      # the first real interaction with a 30s click timeout rather than on
      # anything it was written to test. That is exactly how this pipeline broke
      # once, when it built with a Pages base href that no longer exists.
      - name: Build
        run: npm run build

      # The audit drives the real page in a real browser. It needs Chromium, and
      # nothing else in this project does.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit the built site
        run: npm run audit

      # `llms-full.txt` is generated from the rendered page, so it can go stale
      # the moment somebody edits a sentence. Regenerating it here and failing on
      # a diff is what stops the file an AI crawler reads from quietly describing
      # an older version of the site.
      - name: Check that llms-full.txt is up to date
        run: |
          npm run llms
          if ! git diff --quiet --exit-code public/llms-full.txt; then
            echo "::error::public/llms-full.txt is out of date. Run 'npm run llms' and commit the result."
            git --no-pager diff --stat public/llms-full.txt
            exit 1
          fi
          echo "llms-full.txt is up to date."
