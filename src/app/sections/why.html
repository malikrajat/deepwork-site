<section class="section" id="why">
  <div class="shell">
    <div class="section__head section__head--center" dwReveal>
      <p class="eyebrow">Why DeepWork</p>
      <h2 class="h2 section__title">What it is good at</h2>
      <p class="lead section__lead" style="margin-inline: auto">
        Every point below is something the app actually does — drawn from the product, not from a
        roadmap.
      </p>
    </div>

    <div class="grid grid--2" style="max-width: 46rem; margin-inline: auto">
      <div class="panel panel--good" dwReveal>
        <h3 class="panel__title">
          <span aria-hidden="true">✓</span>
          What it does well
        </h3>
        <ul class="panel__list">
          @for (item of strengths; track item.title) {
            <li>
              <span>
                <b style="color: var(--text)">{{ item.title }}</b>
                <span style="display: block">{{ item.body }}</span>
              </span>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
