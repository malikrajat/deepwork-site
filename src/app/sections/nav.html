<header class="nav" [class.nav--stuck]="stuck()">
  <nav class="shell nav__inner" aria-label="Main">
    <a class="nav__brand" href="#top" (click)="closeMenu()">
      <span class="nav__mark" aria-hidden="true">DW</span>
      <span class="nav__brand-text">{{ site.name }}</span>
    </a>

    <ul class="nav__links" [class.nav__links--open]="menuOpen()" id="site-menu">
      @for (link of links; track link.id) {
        <li>
          <a
            class="nav__link"
            [class.nav__link--active]="activeId() === link.id"
            [href]="'#' + link.id"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="nav__actions">
      <button
        class="nav__icon-btn"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="
          theme() === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme'
        "
      >
        <!-- Inline SVG rather than an icon font or a sprite: two glyphs do not
             justify a dependency, and this way they inherit `currentColor`. -->
        @if (theme() === 'dark') {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
            />
          </svg>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        }
      </button>

      <a class="btn btn--ghost nav__cta" [href]="site.repoUrl" target="_blank" rel="noopener">
        GitHub
      </a>
      <a class="btn btn--primary nav__cta" [href]="site.webAppUrl" target="_blank" rel="noopener">
        Open app
      </a>

      <button
        class="nav__icon-btn nav__toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="site-menu"
        [attr.aria-label]="menuOpen() ? 'Close the menu' : 'Open the menu'"
      >
        @if (menuOpen()) {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </nav>
</header>
