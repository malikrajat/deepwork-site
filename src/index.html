<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />

    <!--
      The title leads with what people actually search for rather than with the
      slogan. "DeepWork" is the brand and belongs first, but "free Pomodoro
      timer, task manager & habits" is the part that has to survive being read
      in a list of ten blue links. 53 characters, so it is not truncated.
    -->
    <title>DeepWork — Free Pomodoro Timer, Tasks &amp; Reminders</title>
    <base href="/" />

    <!-- `viewport-fit=cover` is what lets the page reach under an iPhone's rounded
         corners and notch, so the sticky header and the footer can pad themselves
         with `env(safe-area-inset-*)` instead of leaving bars of dead colour. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta
      name="description"
      content="A free Pomodoro timer, task manager and standing-reminder app for Windows, macOS, Linux and any browser. Offline AI turns your own day into clear analysis, reminders keep asking, and your data never leaves your machine."
    />
    <link rel="canonical" href="https://deepwork-pomodoro.netlify.app/" />

    <!--
      Large image previews and full-length snippets. The defaults are cautious
      and this page wants both: it is a product page whose whole job is to be
      understood from a search result.
    -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Rajat Malik" />
    <meta name="theme-color" content="#080613" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph. The image is generated at authoring time from the real site
         chrome (see `tools/make-og-image.cjs`), so a shared link shows the
         product rather than a stock photo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeepWork" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="DeepWork — Free Pomodoro Timer, Tasks &amp; Reminders" />
    <meta
      property="og:description"
      content="A free Pomodoro timer, task manager and standing-reminder app for desktop and browser. Offline AI analysis, reminders that keep asking, no account, no cloud."
    />
    <meta property="og:url" content="https://deepwork-pomodoro.netlify.app/" />
    <meta property="og:image" content="https://deepwork-pomodoro.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The DeepWork dashboard, with its focus clock and today's tasks."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeepWork — Free Pomodoro Timer, Tasks &amp; Reminders" />
    <meta
      name="twitter:description"
      content="A free Pomodoro timer, task manager and standing-reminder app for desktop and browser. Offline AI analysis, reminders that keep asking, no account, no cloud."
    />
    <meta name="twitter:image" content="https://deepwork-pomodoro.netlify.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The DeepWork dashboard: a focus clock mid-session above today's tasks."
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <!-- iOS ignores SVG for the home-screen icon, so it gets a real PNG. -->
    <link rel="apple-touch-icon" href="icons/128x128.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!--
      A plain-text version of this page for language models, discoverable from
      the markup as well as from `robots.txt`. It is not a standard link
      relation, so agents that do not know it ignore it harmlessly.
    -->
    <link
      rel="alternate"
      type="text/plain"
      href="llms.txt"
      title="DeepWork — summary for language models"
    />

    <!--
      The theme is applied before the first paint, so a visitor who prefers light
      never sees a flash of the dark page. It has to be inline and it has to be
      this small: anything deferred runs after the browser has already painted.

      `system` is the default, which is why the fallback below is the media query
      rather than the dark theme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('deepwork-site-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset['theme'] = theme;
        } catch (_) {
          /* Private mode or blocked storage: the dark default in the markup stands. */
        }
      })();
    </script>

    <!--
      Structured data, as one connected graph rather than four loose objects:
      the WebSite, the person who made it, the application being described, and
      the questions the page answers. Every value here is a fact taken from the
      DeepWork repository — the version, the platforms, the release address, the
      price. `aggregateRating` is deliberately absent: there are no ratings to
      average, and inventing one is both dishonest and against Google's policy.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://deepwork-pomodoro.netlify.app/#website",
            "url": "https://deepwork-pomodoro.netlify.app/",
            "name": "DeepWork",
            "alternateName": "DeepWork — focus timer, tasks and habits",
            "description": "The product site for DeepWork: a free Pomodoro timer, task manager and habit tracker that keeps its data on your own machine.",
            "inLanguage": "en",
            "publisher": { "@id": "https://deepwork-pomodoro.netlify.app/#author" }
          },
          {
            "@type": "Person",
            "@id": "https://deepwork-pomodoro.netlify.app/#author",
            "name": "Rajat Malik",
            "url": "https://rajatmalik.dev/",
            "jobTitle": "Senior Lead Software Engineer",
            "worksFor": { "@type": "Organization", "name": "Siemens" },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Gurgaon",
              "addressCountry": "IN"
            },
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "Ajmer Institute of Technology"
            },
            "knowsAbout": [
              "Angular",
              "React",
              "TypeScript",
              "Micro-frontends",
              "Design systems",
              "Core Web Vitals",
              "WCAG 2.2"
            ],
            "sameAs": [
              "https://rajatmalik.dev/",
              "https://www.linkedin.com/in/errajatmalik",
              "https://www.npmjs.com/~rajatmalik",
              "https://medium.com/@codewithrajat",
              "https://dev.to/codewithrajat",
              "https://github.com/malikrajat"
            ]
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://deepwork-pomodoro.netlify.app/#app",
            "name": "DeepWork",
            "alternateName": "DeepWork — Pomodoro timer, tasks and reminders",
            "applicationCategory": "ProductivityApplication",
            "applicationSubCategory": "Pomodoro timer, task manager, standing reminders",
            "operatingSystem": "Windows, macOS, Linux, Web browser",
            "softwareVersion": "3.0.0",
            "isAccessibleForFree": true,
            "description": "A free, local-first focus timer, task manager and standing-reminder app. Pomodoro-style focus sessions, a day planner, a task board and Eisenhower matrix, Time by Task reporting, habits, journalling, hydration reminders and offline AI analysis, all stored in a local SQLite database with no account and no cloud.",
            "url": "https://deepwork-pomodoro.netlify.app/",
            "installUrl": "https://malikrajat.github.io/deepwork/",
            "downloadUrl": "https://github.com/malikrajat/deepwork/releases/latest",
            "softwareHelp": "https://github.com/malikrajat/deepwork#readme",
            "sameAs": "https://github.com/malikrajat/deepwork",
            "license": "https://github.com/malikrajat/deepwork/blob/main/LICENSE",
            "screenshot": "https://deepwork-pomodoro.netlify.app/screenshots/dashboard-dark.webp",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@id": "https://deepwork-pomodoro.netlify.app/#author" },
            "featureList": [
              "Pomodoro-style focus timer with work, short break and long break sessions",
              "Daily timeline planner that schedules queued tasks into focus blocks",
              "Task board with To Do, In Progress and Done columns and drag and drop",
              "Eisenhower matrix for prioritising tasks across four quadrants",
              "Time by Task: focus sessions grouped by the work’s title, with rhythm, consistency and a detail sheet",
              "Standing reminders that keep asking across a closed laptop and a restart until Done, Snooze or Stop",
              "Quiet controls: pause, a timed sound mute, and focus mode on every surface",
              "Answerable completion alerts with Pause, Next, Resume and Hold up, and a crossed alert that returns in three minutes",
              "A matrix that reflows around folded quadrants, with draggable dividers",
              "Habit tracking with streaks and a 30-day check-in strip",
              "Daily journal with writing statistics",
              "Water reminder and hydration tracking against a daily target",
              "Offline AI analysis: plain-language readings of your own sessions, tasks, habits and journal",
              "On-device analytics: a 12-week focus heatmap, focus by hour and weekday, task flow and habit consistency",
              "Recurring tasks (daily, weekly or monthly) with weekdays and an end date",
              "Import tasks from Excel or CSV, and export to CSV with 24 columns",
              "Desktop tray, an always-on-top window and a draggable floating mini widget",
              "Local SQLite storage with no account, no cloud sync and no telemetry on your work",
              "Dark, light and system themes",
              "Works offline: fonts ship with the app and alert tones are generated"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://deepwork-pomodoro.netlify.app/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is DeepWork really free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. There is no paid tier, no subscription and no account to create. The web app and the desktop installers are free to download and use."
                }
              },
              {
                "@type": "Question",
                "name": "Where is my data kept?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "On your machine. The desktop app writes to a local SQLite database and the browser build keeps its data in your own browser storage. There is no DeepWork server and no sync. The desktop makes only the public GitHub release check, an installer download you press, and links you open; the hosted web app also counts visits, and that is the one exception — see “Does the web app count my visit?”."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work offline?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The desktop app works entirely offline: its fonts, sounds and database are all local. The browser build registers a service worker, so it keeps working after the first visit and can be installed to your home screen or desktop."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. There is nothing to sign up for and nothing to sign in to. Open the app and start working."
                }
              },
              {
                "@type": "Question",
                "name": "Does it sync across my devices?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No, and by design. Each installation keeps its own database, so nothing leaves the machine it was written on. A full JSON backup restores everything on another machine, and tasks can also be exported to CSV and imported back."
                }
              },
              {
                "@type": "Question",
                "name": "Which platforms can I use it on?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Windows, macOS and Linux as a desktop app, and any modern browser — including on a phone or tablet — as the web app. There is no native iOS or Android app."
                }
              },
              {
                "@type": "Question",
                "name": "Can I use it for a team?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not currently. DeepWork is a single-person tool: it has no shared boards, no accounts and no collaboration features."
                }
              },
              {
                "@type": "Question",
                "name": "What is Time by Task?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A page that groups every focus session by the work’s title rather than by the task row. A daily Code review is a new task every morning, so counting rows would scatter the history; Time by Task shows one line with one all-time total, the sessions and active days, the first and last session, and whether the work repeats daily, weekly, monthly or is a one-off. It is at /time, and Ctrl+7 opens it."
                }
              },
              {
                "@type": "Question",
                "name": "What is a standing reminder?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A reminder for the things a normal reminder is worst at — a presentation, a class, a dose, a train — where you may be standing in front of a room and cannot answer. It is stored rather than scheduled, so closing the laptop does not cancel it; it escalates rather than repeating on a stopwatch; and it keeps asking until you press Done, Snooze 10 min or Stop. There is no close cross and no timeout."
                }
              },
              {
                "@type": "Question",
                "name": "Will a standing reminder interrupt a presentation?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. It posts a sticky desktop notification and an in-app card, and it never brings the window forward. The notification carries the same three answers as the card, so the question can be dealt with where it is, without the app covering the thing it is reminding you about."
                }
              },
              {
                "@type": "Question",
                "name": "What is the difference between pause, mute and focus mode?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A pause stops the timer, the cards and the system notifications together, and restarts only a timer it stopped. A mute changes the sound only — cards still arrive — and expires by itself, even after a restart. Focus mode hides the navigation and leaves every reminder running, because a focus session is exactly when the completion alert matters."
                }
              },
              {
                "@type": "Question",
                "name": "Does the web app count my visit?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The hosted browser build counts visits with GoatCounter, so “is anybody using this?” has an answer without DeepWork running a server. It sends the page — path, title, referrer, screen width, language and time zone — never a task, a journal entry or an identifier, and GoatCounter stores no IP address for it. Count my visits is a switch in Settings, and with it off the script is never fetched. The desktop build is never counted."
                }
              },
              {
                "@type": "Question",
                "name": "What happens if my database is damaged?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A database that is present but unreadable stops startup with a card naming the file and the reason, instead of being replaced by an empty one that looks the same. Every launch also copies the database and its write-ahead log into a backups folder beside it before migrations run, and those copies are kept rather than rotated."
                }
              },
              {
                "@type": "Question",
                "name": "Does DeepWork use AI?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — an offline one. DeepWork’s AI reads the sessions, tasks, habits and journal entries you already have, turns them into plain-language analysis, and shows you where your day is going, what is working and what to aim for next — so you can set a target and stay ahead of it. It runs on your own machine, from your own data: nothing is uploaded, there is no account and there is no cloud model to trust."
                }
              }
            ]
          }
        ]
      }

  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <app-root></app-root>

    <!--
      There is no summary of the page here, and that is the point: the build
      prerenders the whole site into `index.html`, so a visitor without
      JavaScript — and a crawler that never runs any — already has every word of
      it. The heading that used to live here was also a second `h1` in the
      document, which is a heading-hierarchy bug as well as duplicate content.
      What remains is the one action a script-less visitor might still want.
    -->
    <noscript>
      <p class="noscript">
        DeepWork is a free focus timer, task manager and habit tracker.
        <a href="https://malikrajat.github.io/deepwork/">Open the web app</a>.
      </p>
    </noscript>
  </body>
</html>
